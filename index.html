                      <div className="flex justify-between">

                    </div>

                  <div className="pt-2">
                    <button

                      Dismiss Inspection

            {/* FOOTER */}
            <footer className="border-t theme-border theme-bg-card theme-text-muted text-xs py-3 px-4 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-2">

            </footer>

          </div>

        </div>
      );
    }

    // Mount React Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ResilinkErrorBoundary><App /></ResilinkErrorBoundary>);
  </script>
