  class ResilinkErrorBoundary extends React.Component {
    constructor(props) {
      super(props);
      this.state = { hasError: false, error: null };
    }
    static getDerivedStateFromError(error) {
      return { hasError: true, error: error };
    }
    componentDidCatch(error, errorInfo) {
      console.error('RESILINK Boundary Caught Error:', error, errorInfo);
    }
    render() {
      if (this.state.hasError) {
        return (
          <div className="min-h-screen theme-bg-app flex items-center justify-center p-6 font-sans">
            <div className="max-w-md w-full theme-bg-card border-2 border-red-500/50 rounded-2xl p-8 theme-card-shadow text-center space-y-4">
              <div className="w-14 h-14 mx-auto rounded-2xl bg-red-500/10 text-red-500 flex items-center justify-center text-2xl font-bold">
                ⚠️
              </div>
              <h2 className="text-xl font-bold theme-text-main">Supply Chain Control Tower Active</h2>
              <p className="text-xs theme-text-muted leading-relaxed">
                An active operational state transition is being finalized. Click below to refresh your control tower view.
              </p>
              {this.state.error && (
                <div className="p-3 bg-red-500/10 border border-red-500/30 rounded-xl text-left text-red-500 text-[11px] font-mono overflow-auto max-h-36">
                  <div className="font-bold">{this.state.error.message || String(this.state.error)}</div>
                </div>
              )}
              <div className="pt-2 flex flex-col sm:flex-row gap-2 justify-center">
                <button
                  onClick={() => {
                    this.setState({ hasError: false, error: null });
                    window.location.reload();
                  }}
                  className="px-5 py-2.5 rounded-xl bg-gradient-to-r from-[#0A6ED1] to-blue-600 hover:brightness-110 text-white font-bold text-xs shadow-md shadow-blue-500/25 cursor-pointer"
                >
                  Reload Organisation Control Tower
                </button>
                <button
                  onClick={() => {
                    try { localStorage.clear(); } catch (e) {}
                    this.setState({ hasError: false, error: null });
                    window.location.href = window.location.pathname;
                  }}
                  className="px-4 py-2.5 rounded-xl border theme-border hover:theme-bg-elevated theme-text-muted hover:theme-text-main text-xs font-mono cursor-pointer"
                >
                  Reset Cache & Restart
                </button>
              </div>
            </div>
          </div>
        );
      }
      return this.props.children;
    }
  }

                    {(inspectedEntity.category.includes('Freight') || inspectedEntity.category.includes('Shipment') || inspectedEntity.id === 'SHP-SUM') && (
                      <div className="grid grid-cols-2 gap-3 text-xs font-mono">
                        <div className="col-span-2 p-3 rounded-xl theme-bg-elevated border theme-border">
                          <span className="text-[10px] theme-text-muted block">TRANSIT STATUS</span>
                          <span className="font-bold text-sm text-[#0A6ED1]">{inspectedEntity.transitStatus || 'In Transit (On Schedule)'}</span>
                        </div>
                        <div className="p-3 rounded-xl theme-bg-elevated border theme-border">
                          <span className="text-[10px] theme-text-muted block">ESTIMATED ARRIVAL (ETA)</span>
                          <span className="font-bold text-sm text-emerald-500">{inspectedEntity.eta || '3 Days'}</span>
                        </div>
                        <div className="p-3 rounded-xl theme-bg-elevated border theme-border">
                          <span className="text-[10px] theme-text-muted block">CARRIER</span>
                          <span className="font-bold text-sm theme-text-main">{inspectedEntity.carrier || 'DB Schenker Logistics'}</span>
                        </div>
                        <div className="col-span-2 p-3 rounded-xl theme-bg-elevated border theme-border">
                          <span className="text-[10px] theme-text-muted block">TRACKING IDENTIFIER</span>
                          <span className="font-bold theme-text-main text-[#7C4DFF]">{inspectedEntity.trackingCode || 'TRK-SAP-8812'}</span>
                        </div>
                      </div>
                    )}


                    {/* SAP ERP Details */}
                    <div className="p-3.5 rounded-xl theme-bg-elevated border theme-border space-y-2 text-xs font-mono">
                      <div className="text-[10px] font-mono font-bold theme-text-muted uppercase">Enterprise ERP Linkage:</div>
                      <div className="flex justify-between">
                        <span className="theme-text-muted">Storage Loc / Plant:</span>
                        <span className="font-bold theme-text-main">{inspectedEntity.sapStorageLoc || inspectedEntity.sapPlantCode || inspectedEntity.sapLocation || 'SLOC_DEFAULT'}</span>
                      </div>
                      <div className="flex justify-between">
                        <span className="theme-text-muted">PO / Contract:</span>
                        <span className="font-bold theme-text-main">{inspectedEntity.sapPo || inspectedEntity.sapContractGroup || 'PO-GLOBAL-2026'}</span>
                      </div>
                    </div>
                  </div>

                  <div className="pt-2">
                    <button
                      onClick={() => setInspectedEntity(null)}
                      className="w-full py-2.5 rounded-xl border theme-border text-xs font-semibold theme-text-muted hover:theme-text-main cursor-pointer"
                    >
                      Dismiss Inspection
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* FOOTER */}
            <footer className="border-t theme-border theme-bg-card theme-text-muted text-xs py-3 px-4 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-2">
              <div className="flex items-center space-x-2">
                <span className="font-extrabold theme-text-main">RESILINK</span>
                <span>•</span>
                <span>Sense. Reason. Adapt.</span>
                <span>•</span>
                <span className="text-cyan-600 dark:text-cyan-400 font-semibold">SAP BTP & CAP Native</span>
              </div>
              <div className="font-mono text-[11px]">
                User: vp.pia@resilink.corp • Session: ACTIVE (TLS 1.3)
              </div>
            </footer>

          </div>

        </div>
      );
    }

    // Mount React Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ResilinkErrorBoundary><App /></ResilinkErrorBoundary>);
  </script>
</body>
</html>
